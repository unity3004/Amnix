services:
  postgres:
    image: postgres:16-alpine
    container_name: amnix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Host port remapped to 5433 -> container 5432 because this machine
    # already has another project's postgres bound to host 5432. Container
    # port and in-network DNS name ("postgres") are unchanged. On a machine
    # without that conflict, this can be reverted to "5432:5432".
    ports:
      - "5433:5432"
    volumes:
      - amnix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - amnix-network

  redis:
    image: redis:7-alpine
    container_name: amnix-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    # Host port remapped to 6380 -> container 6379 for the same reason as
    # postgres above (host 6379 already taken). Revert to "6379:6379" on a
    # machine without that conflict.
    ports:
      - "6380:6379"
    volumes:
      - amnix_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - amnix-network

networks:
  amnix-network:
    name: amnix-network
    driver: bridge

volumes:
  amnix_postgres_data:
    name: amnix_postgres_data
  amnix_redis_data:
    name: amnix_redis_data
